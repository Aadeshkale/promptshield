[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield"
version = "0.1.0"
description = "Prompt security library: detects secrets, PII, and prompt injections before they reach any LLM"
readme = "readme.md"
license = { text = "MIT" }
authors = [{ name = "Aadesh Kale" }]
requires-python = ">=3.10"
keywords = ["llm", "security", "secrets", "pii", "prompt-injection", "guardrails", "ai-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Aadeshkale/promptshield"
Repository = "https://github.com/Aadeshkale/promptshield"
Issues = "https://github.com/Aadeshkale/promptshield/issues"

[project.optional-dependencies]
injection = ["transformers>=4.30", "torch>=2.0"]
backends = ["detect-secrets>=1.5.0", "prompt-injection-defense>=0.10.0", "presidio-analyzer>=2.2.0"]
litellm = ["litellm>=1.40.0"]
all = ["promptshield[injection,backends,litellm]"]

[tool.setuptools.packages.find]
include = ["promptshield*"]
exclude = ["examples*"]
